name: CI
on:
  push:
  pull_request:
  schedule: [{ cron: "23 7 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact .
  test:
    name: Unit + live + MCP + blocks.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:live || (echo "::warning::retrying once (live upstreams)"; sleep 30; npm run test:live)
      - name: blocks.json validates against the org schema
        run: |
          curl -sSfL https://raw.githubusercontent.com/Blockchains/.github/main/docs/blocks.schema.json -o /tmp/blocks.schema.json
          npx -y -p ajv-cli@5 -p ajv-formats@2 ajv validate --spec=draft2020 -c ajv-formats -s /tmp/blocks.schema.json -d blocks.json
  e2e:
    name: Browser e2e (built site, incl. offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx -y playwright@1.64.0 install --with-deps chromium
      - name: Build with small budgets (reuses the live rolling state)
        run: node scripts/build-site.mjs
        env: { MAX_SCANS: 5, CG_PAGES: 1, CG_CATS_PER_BUILD: 2, GT_BUDGET: 5, SCAN_BUDGET: 3, POOLS_BUDGET: 20, ASSETS_BUDGET: 10, RAYDIUM_BUDGET: 10, IMPACT_BUDGET: 6, PAGEFIND: 1 }
      - run: npm run test:e2e || (sleep 30; npm run test:e2e)
  freshness:
    name: Live rankings are fresh (scheduled Pages rebuilds working)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSf https://blockchains.github.io/memecoin-markets/v1/markets.json | python3 -c "
          import json,sys,datetime as D
          d=json.load(sys.stdin); age=(D.datetime.now(D.timezone.utc)-D.datetime.fromisoformat(d['generated_at'].replace('Z','+00:00'))).total_seconds()/60
          print('ranked',d['count'],'age_min',round(age)); assert d['count']>=300 and age<120"

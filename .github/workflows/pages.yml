name: Pages (rankings + token pages + JSON API)
on:
  push: { branches: [main] }
  schedule: [{ cron: "7,37 * * * *" }]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build (free public data; rolling caches from the live v1/state.json)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
        run: node scripts/build-site.mjs || (sleep 60; node scripts/build-site.mjs)
      - name: Sanity — refuse to deploy an empty or broken build
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open('_site/v1/markets.json')); n=d['count']
          assert n>=300, f'only {n} ranked tokens'
          s=open('_site/sitemap.xml').read(); assert s.count('/token/')>=300, 'sitemap too small'
          assert os.path.exists('_site/token/solana/DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263/index.html')
          print('ranked',n,'sitemap token urls',s.count('/token/'))
          PY
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Live endpoints, token pages and SEO files
        run: |
          set -e
          B=https://blockchains.github.io/memecoin-markets
          sleep 20
          for f in v1/index.json v1/markets.json v1/tokens-index.json v1/radar-solana.json v1/scans-solana.json lib/index.js llms.txt robots.txt sitemap.xml; do
            curl -sSf --retry 8 --retry-all-errors --retry-delay 10 -D /tmp/h "$B/$f" -o /tmp/b; grep -qi 'access-control-allow-origin: \*' /tmp/h; echo "ok $f $(wc -c </tmp/b) bytes"
          done
          for p in "" token/solana/DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263/ trending/ new/ gainers/ guides/uk-memecoin-tax/ tools/; do
            code=$(curl -s -o /tmp/p -w '%{http_code}' --retry 5 --retry-all-errors "$B/$p"); grep -q '<link rel="canonical"' /tmp/p; echo "$code /$p"; test "$code" = 200
          done
          curl -sSf "$B/sitemap.xml" | grep -o '<loc>[^<]*/token/[^<]*</loc>' | sed 's/<[^>]*>//g' | shuf -n 10 --random-source=/dev/urandom > /tmp/sample
          while read u; do code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "$u"); echo "$code $u"; test "$code" = 200; done < /tmp/sample
      - run: npm ci && npx -y playwright@1.64.0 install --with-deps chromium
      - name: Browser e2e against live Pages
        run: E2E_URL=https://blockchains.github.io/memecoin-markets/ npm run test:e2e || (sleep 45; E2E_URL=https://blockchains.github.io/memecoin-markets/ npm run test:e2e)
